name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          allow-checksums: 'a263b23da79c111ae8605e26df39a2e1a9842eb079bcec4d30ec20b441cc8eb0,a5e75118d96b4eac2100876f6af6a5ca5029cd440f87736425350fb4cf308b42,cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create .env from .env.example
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Img2Img-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
